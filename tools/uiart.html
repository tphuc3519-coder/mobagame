<html lang="vi">

<title>Dựng ảnh giao diện — Lantern Arena</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/" } }</script>

<body>
<canvas id="c"></canvas>
<script type="module">
// Dựng ảnh tĩnh cho sảnh / màn tải từ model thật của game (chạy bằng tools/uiart/render.cjs, xem ghi chú ở đó):
//   ?mode=card&id=<tướng>&clip=&t=&zoom=&dy=&spin=   thẻ tướng dọc 3:4 (màn tải VS, phòng chờ, đội hình)
//   ?mode=face&id=<tướng>&size=256                    chân dung đầu (nền trong suốt)
//   ?mode=keyart                                       ảnh nền màn tải đầu game (ba tướng + cột sáng + trăng)
//   ?mode=room                                         nền phòng chờ ghép trận (năm tướng quay lưng nhìn tế đàn xa)
//   ?mode=lobby                                        phông sảnh chính: quảng trường đêm hội (đài phun đèn lồng, tháp canh, cột đèn,
//                                                      dây đèn lồng giăng, trăng) — tướng 3D của sảnh đứng trước, giữa ảnh
// Kết quả: window.out = dataURL (JPEG/PNG) sau khi vẽ xong; hậu kỳ (bloom, tối viền) làm bằng canvas 2D.
import * as THREE from 'three';
import { loadHero } from './src/render/assets.js';
import { createShowcase, makeHolder, backdrop, lanterns, sparkles } from './src/showcase/showcase.js';
import { createSplash } from './src/showcase/splash.js';
import { setOutlineResolution } from './src/render/materials.js';
import { glowTexture } from './src/render/env/textures.js';
import { createCore, createFountain, createTower } from './src/render/structures.js';
import { flagstoneSurface } from './src/render/env/surfaces.js';

const q = new URLSearchParams(location.search), mode = q.get('mode') || 'card';
const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
const W = num('w', 480), H = num('h', 640), SS = num('ss', 2); // kích thước ảnh ra + siêu lấy mẫu
const cv = document.getElementById('c'); cv.style.width = W + 'px'; cv.style.height = H + 'px';
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/** Hậu kỳ: bloom (lọc vùng sáng, làm mờ 2 cỡ, cộng sáng), tối viền, ra canvas W×H. */
function post(src, { bloom = 0.55, thr = 0.6, vignette = 0.6, cy = 0.45 } = {}) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, W, H);
  const b = document.createElement('canvas'); b.width = Math.ceil(W / 4); b.height = Math.ceil(H / 4); const bx = b.getContext('2d');
  bx.drawImage(src, 0, 0, b.width, b.height);
  const d = bx.getImageData(0, 0, b.width, b.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const l = (0.2126 * p[i] + 0.7152 * p[i + 1] + 0.0722 * p[i + 2]) / 255, k = Math.max(0, (l - thr) / (1 - thr)); p[i] *= k; p[i + 1] *= k; p[i + 2] *= k; }
  bx.putImageData(d, 0, 0);
  x.save(); x.globalCompositeOperation = 'screen';
  x.globalAlpha = bloom; x.filter = `blur(${Math.round(W / 140)}px)`; x.drawImage(b, 0, 0, W, H);
  x.globalAlpha = bloom * 0.8; x.filter = `blur(${Math.round(W / 45)}px)`; x.drawImage(b, 0, 0, W, H);
  x.restore();
  const g = x.createRadialGradient(W / 2, H * cy, Math.min(W, H) * 0.32, W / 2, H * cy, Math.hypot(W, H) * 0.62);
  g.addColorStop(0, 'rgba(4,3,14,0)'); g.addColorStop(1, `rgba(4,3,14,${vignette})`); x.fillStyle = g; x.fillRect(0, 0, W, H);
  return c;
}

/** Khung nửa người theo xương: từ dưới hông tới trên đỉnh đầu, tâm ngang giữa đầu và hông (vũ khí vung lệch không kéo lệch khung). */
function frameUpper(cam, root, { top = 0.42, bottom = 0.6, aspect = W / H, lift = 0 } = {}) {
  root.updateMatrixWorld(true);
  const pos = (n) => { let b = null; root.traverse((o) => { if (o.name === n) b = o; }); return b ? b.getWorldPosition(new THREE.Vector3()) : null; };
  const hd = pos('Bone_Head') || new THREE.Vector3(0, 1.6, 0), hp = pos('Bone_Hips') || new THREE.Vector3(0, 0.95, 0);
  const y0 = hp.y - bottom, y1 = hd.y + top, cy = (y0 + y1) / 2 + lift, span = y1 - y0;
  const L = new THREE.Vector3(hd.x * 0.55 + hp.x * 0.45, cy, hd.z * 0.55 + hp.z * 0.45);
  const vf = THREE.MathUtils.degToRad(cam.fov) / 2, dist = (span / 2) / Math.tan(vf) * 1.04;
  cam.position.set(L.x, L.y + span * 0.04, L.z + dist); cam.lookAt(L); cam.aspect = aspect; cam.updateProjectionMatrix();
}

async function card() {
  const id = q.get('id');
  await loadHero(id, { showcase: true }); // bản trưng bày nạp sẵn → show() dùng thẳng, không đổi giữa chừng
  const show = createShowcase(cv, { quality: 'high', stand: false, autoSpin: false, preserve: true });
  await show.show(id);
  await wait(2500); // vài khung cho mây/tia sáng phông chạy, texture lên đủ
  show.pause(); const h = show.current; h.life = 9; h.g.scale.setScalar(1); h.mats.setFlash(0); // máy chậm: hiệu ứng "hiện ra" (phóng to + loé trắng) có thể chưa chạy xong
  show.stage.rotation.y = num('spin', -0.35); show.pose(q.get('clip') || 'Showcase', num('t', 2));
  frameUpper(show.camera, show.stage, { top: num('top', 0.42), bottom: num('bottom', 0.62), lift: num('lift', 0) });
  show.renderer.render(show.scene, show.camera);
  return post(cv, { bloom: 0.32, thr: 0.7, vignette: 0.5, cy: 0.4 }).toDataURL('image/jpeg', 0.86);
}

async function face() {
  const id = q.get('id'), size = num('size', 256), m = await loadHero(id, { showcase: true });
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(size, size, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15; setOutlineResolution(size, size);
  const sc = new THREE.Scene(), h = makeHolder(m, id, { renderer, env: null });
  sc.add(new THREE.HemisphereLight(0xe8eeff, 0x50404a, 1.5)); const k = new THREE.DirectionalLight(0xfff0e0, 2.8); k.position.set(1.2, 2, 3); sc.add(k);
  const r2 = new THREE.DirectionalLight(new THREE.Color(h.art.rim || '#fff'), 3.2); r2.position.set(-2, 2, -2.5); sc.add(r2);
  sc.add(h.g); h.freeze(h.acts.ShowIdle ? 'ShowIdle' : 'Idle', 0.3); h.g.rotation.y = num('spin', -0.25); h.g.updateMatrixWorld(true);
  let hb = null; h.g.traverse((o) => { if (o.name === 'Bone_Head') hb = o; }); const hd = hb ? hb.getWorldPosition(new THREE.Vector3()) : new THREE.Vector3(0, h.h * 0.85, 0);
  const pf = h.art.portrait || {}, d = num('dist', 0.9) * (pf.dist ? Math.min(1.6, pf.dist / 1.3) : 1), dy = num('dy', 0.06) + (pf.dy || 0) * 0.5;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 20); cam.position.set(hd.x + 0.12, hd.y + dy + 0.05, hd.z + d); cam.lookAt(hd.x, hd.y + dy, hd.z);
  renderer.setClearColor(0x000000, 0); renderer.render(sc, cam);
  return cv.toDataURL('image/png');
}

/** Ảnh toàn thân nền trong suốt (màn sau trận): khung theo xương từ bàn chân tới trên đỉnh đầu/vũ khí, dáng chiến thắng hoặc đứng. */
async function splash() {
  const id = q.get('id'), m = await loadHero(id, { showcase: true });
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(SS); renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1; setOutlineResolution(W * SS, H * SS);
  const sc = new THREE.Scene(), h = makeHolder(m, id, { renderer, env: null });
  sc.add(new THREE.HemisphereLight(0xdde6ff, 0x4a3a48, 1.3)); const k = new THREE.DirectionalLight(0xfff0e0, 2.6); k.position.set(1.5, 3, 4); sc.add(k);
  const r2 = new THREE.DirectionalLight(new THREE.Color(h.art.rim || '#fff'), 3.4); r2.position.set(-2.5, 2.5, -2.5); sc.add(r2);
  const f2 = new THREE.DirectionalLight(0x8ab4ff, 0.8); f2.position.set(-3, 1, 2); sc.add(f2);
  sc.add(h.g); const clip = q.get('clip') || 'ShowIdle'; h.freeze(h.acts[clip] ? clip : 'Idle', num('t', 0.3)); h.g.rotation.y = num('spin', -0.3); h.g.updateMatrixWorld(true);
  const v = new THREE.Vector3(); let y0 = 0, y1 = 0, x0 = 1e9, x1 = -1e9; const cam = new THREE.PerspectiveCamera(26, W / H, 0.05, 50);
  h.g.traverse((o) => { if (!o.isBone) return; o.getWorldPosition(v); y1 = Math.max(y1, v.y); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); });
  // bề ngang theo lưới đã tạo dáng (vũ khí to như búa của Emberforge vươn xa hơn xương): khung đủ rộng để không cắt mép trái/phải
  const box = new THREE.Box3(); h.g.traverse((o) => { if (!o.isMesh || !o.visible) return; if (o.isSkinnedMesh) { o.skeleton.update(); o.computeBoundingBox(); box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); } else box.expandByObject(o); });
  if (!box.isEmpty()) { x0 = Math.min(x0, box.min.x); x1 = Math.max(x1, box.max.x); y1 = Math.max(y1, box.max.y - 0.28); y0 = Math.min(y0, box.min.y); }
  y1 += 0.28; const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, span = Math.max((y1 - y0) * 1.12, ((x1 - x0) * 1.15) / (W / H)); // chụp rộng, lát nữa cắt lại theo hình
  const dist = (span / 2) / Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2);
  cam.position.set(cx, cy + span * 0.03, dist); cam.lookAt(cx, cy, 0);
  renderer.setClearColor(0x000000, 0); renderer.render(sc, cam);
  // khung lại theo vùng có hình (alpha > 8): vừa khít bề ngang / chiều cao, chân sát mép dưới — tướng nào cũng đứng cùng một chỗ trên màn
  const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const g2 = c2.getContext('2d'); g2.drawImage(cv, 0, 0);
  const d = g2.getImageData(0, 0, c2.width, c2.height).data; let bx0 = c2.width, by0 = c2.height, bx1 = -1, by1 = -1;
  for (let y = 0; y < c2.height; y++) for (let x = 0; x < c2.width; x++) if (d[(y * c2.width + x) * 4 + 3] > 8) { if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y; }
  if (bx1 < 0) return cv.toDataURL('image/png');
  const o = document.createElement('canvas'); o.width = cv.width; o.height = cv.height; const go = o.getContext('2d');
  const bw = bx1 - bx0 + 1, bh = by1 - by0 + 1, fit = Math.min((o.width * 0.94) / bw, (o.height * 0.965) / bh), dw = bw * fit, dh = bh * fit;
  go.imageSmoothingQuality = 'high'; go.drawImage(c2, bx0, by0, bw, bh, (o.width - dw) / 2, o.height * 0.985 - dh, dw, dh);
  return o.toDataURL('image/png');
}

/** Sân khấu nhiều tướng (ảnh nền): phông trời + mây xoáy splash + đèn trời + bụi sáng; trả về các hàm đặt tướng/vẽ. */
async function stageScene({ colors = ['#ffb04a', '#ffe7b0'], fov = 34 } = {}) {
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(SS); renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
  setOutlineResolution(W * SS, H * SS);
  const scene = new THREE.Scene(); scene.add(backdrop()); scene.fog = new THREE.Fog(0x14122a, 14, 70);
  const splash = createSplash(); splash.setColors(new THREE.Color(colors[0]), new THREE.Color(colors[1])); scene.add(splash.group);
  scene.add(new THREE.HemisphereLight(0xbcc8ff, 0x4a3040, 0.7));
  const key = new THREE.DirectionalLight(0xfff0dc, 2.6); key.position.set(2, 4, 6); scene.add(key);
  const fill = new THREE.DirectionalLight(0x8ab4ff, 1.0); fill.position.set(-4, 2, 3); scene.add(fill);
  const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 300);
  const lan = lanterns(40); scene.add(lan.group); const sp = sparkles(320); sp.mat.uniforms.uH.value = H * SS; scene.add(sp.object);
  const ctx = { renderer, env: null };
  async function hero(id, { x = 0, z = 0, rot = 0, scale = 1, clip = 'ShowIdle', t = 0, u = null, rim = null } = {}) {
    const m = await loadHero(id, { showcase: true }); if (!m) return null;
    const h = makeHolder(m, id, ctx); h.g.position.set(x, 0, z); h.g.rotation.y = rot; h.g.scale.setScalar(scale);
    const a = h.acts[clip]; if (u != null && a) t = u * a.getClip().duration; // u: vị trí trong clip (0..1)
    if (!h.freeze(clip, t)) h.freeze('Idle', 0);
    if (rim) { const l = new THREE.PointLight(new THREE.Color(rim), 6, 6, 1.4); l.position.set(x - 0.6, 2.2, z - 1.2); scene.add(l); }
    scene.add(h.g); return h;
  }
  return { renderer, scene, camera, splash, lan, sp, hero,
    async draw(sec = 2) { for (let i = 0, t = 0; i < sec * 20; i++) { t += 0.05; lan.update(t, 0.05); splash.update(t, H * SS); sp.mat.uniforms.uT.value = t; } renderer.render(scene, camera); await wait(50); renderer.render(scene, camera); } };
}

/** Cột sáng lớn + trăng tròn sau lưng tướng giữa (kiểu tranh mở màn). */
function beamAndMoon(scene, { x = 0, z = -9, w = 3.2, h = 26, moonY = 8.5, color = 0xd8c8ff } = {}) {
  const beam = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uC: { value: new THREE.Color(color) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 uC; varying vec2 vUv; void main(){ float x = abs(vUv.x - 0.5) * 2.0; float core = exp(-x * x * 18.0), halo = exp(-x * x * 3.0) * 0.35;
      float y = smoothstep(0.0, 0.25, vUv.y) * (0.75 + 0.25 * vUv.y); float a = (core * 1.3 + halo) * y; gl_FragColor = vec4(mix(uC, vec3(1.0), core * 0.6) * a, a); }` }));
  beam.position.set(x, h / 2 - 1.5, z); scene.add(beam);
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xffe2b0, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.45 }));
  moon.scale.set(10, 10, 1); moon.position.set(x, moonY, z - 6); scene.add(moon);
  // mặt trăng: vàng nhạt, loang lổ (nhiễu), tối dần ra mép — không phải đĩa trắng phẳng
  const disc = new THREE.Mesh(new THREE.CircleGeometry(2.1, 64), new THREE.ShaderMaterial({ fog: false, transparent: true, depthWrite: false,
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy / 2.1; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec2 vP; float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
      void main(){ float r = length(vP); float m = n(vP * 3.0 + 2.0) * 0.55 + n(vP * 7.0) * 0.3 + n(vP * 15.0) * 0.15;
        vec3 c = mix(vec3(1.0, 0.93, 0.78), vec3(0.78, 0.68, 0.58), smoothstep(0.45, 0.8, m)) * (1.0 - 0.35 * r * r);
        gl_FragColor = vec4(c * 0.92, 1.0 - smoothstep(0.97, 1.0, r)); }` }));
  disc.position.set(x, moonY, z - 6.2); scene.add(disc);
  return { beam, moon };
}

/** Nền đất tối có gợn sáng (cỏ đêm) để tướng đứng trên một mặt phẳng, mờ dần vào sương. */
function ground(scene, { color = 0x1d1830, glow = 0xffc070, size = 30 } = {}) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(size, 96), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, fog: false,
    uniforms: { uC: { value: new THREE.Color(color) }, uG: { value: new THREE.Color(glow) } },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 uC, uG; varying vec2 vP; void main(){ float r = length(vP); float a = 1.0 - smoothstep(6.0, ${size.toFixed(1)}, r);
      vec3 c = uC + uG * exp(-r * r * 0.06) * 0.55; gl_FragColor = vec4(c, a * (1.0 - smoothstep(3.0, 14.0, r)) + a * 0.0); }` }));
  m.rotation.x = -Math.PI / 2; m.renderOrder = -1; scene.add(m);
  const mist = new THREE.SpriteMaterial({ map: glowTexture(), color: 0x9a8cff, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.16 });
  for (let i = 0; i < 26; i++) { const s = new THREE.Sprite(mist); const a = i * 2.4, r = 2 + (i * 7 % 13); s.position.set(Math.cos(a) * r, 0.25, Math.sin(a) * r * 0.5 - 2); s.scale.set(5 + (i % 4), 1.4, 1); scene.add(s); }
  return m;
}

async function keyart() {
  const st = await stageScene({ colors: ['#8a5cff', '#ffd9a0'], fov: num('fov', 34) });
  const { scene, camera } = st;
  ground(scene, { color: 0x1c1630, glow: 0xffb070 });
  beamAndMoon(scene, { x: num('bx', 0), z: -9, w: 2.6, h: 30, moonY: num('my', 9.5) });
  // đủ 6 tướng: Emberforge giữa (gần, vung búa chéo), Moonstream trái, Bamboo Shade phải (hai kiếm dang ngang); Mossback, Kitewing, Lanternward phía sau
  await st.hero('hoa_ren', { x: 0, z: 1.0, rot: num('r1', -0.3), clip: q.get('c1') || 'Ult', u: num('u1', 0.786), scale: 1.08, rim: '#ff7a1a' });
  await st.hero('nguyet_ha', { x: -2.7, z: -0.4, rot: num('r2', -0.15), clip: q.get('c2') || 'Ult', u: num('u2', 0.643), rim: '#8fd3ff' });
  await st.hero('bong_tre', { x: 2.8, z: -0.3, rot: num('r3', -0.35), clip: q.get('c3') || 'Cast2', u: num('u3', 0.5), rim: '#5dff8a' });
  await st.hero('thach_quy', { x: -5.0, z: -3.6, rot: 0.5, clip: 'Victory', u: 0.5, scale: 0.95 });
  await st.hero('canh_dieu', { x: 5.2, z: -3.4, rot: num('r5', -0.35), clip: 'Attack1', u: num('u5', 0.45), scale: 0.95 });
  camera.position.set(0, num('cy', 1.0), num('cz', 11.5)); camera.lookAt(0, num('ly', 2.35), 0);
  await st.draw(3);
  return post(cv, { bloom: 0.62, thr: 0.58, vignette: 0.7, cy: 0.42 }).toDataURL('image/jpeg', 0.86);
}

async function room() {
  const st = await stageScene({ colors: ['#4fa8ff', '#e0f0ff'], fov: 40 });
  const { scene, camera } = st;
  ground(scene, { color: 0x1a1f38 });
  const core = createCore(0); core.object.scale.setScalar(0.022); core.object.position.set(0, 0, -26); scene.add(core.object); core.update(0.5, 1, false);
  beamAndMoon(scene, { x: 0, z: -24, w: 2.2, h: 40, moonY: 13, color: 0xbfe6ff });
  const ids = ['thach_quy', 'nguyet_ha', 'hoa_ren', 'bong_tre', 'canh_dieu'];
  for (const [i, id] of ids.entries()) await st.hero(id, { x: (i - 2) * 1.55, z: -Math.abs(i - 2) * 0.55, rot: Math.PI + (i - 2) * 0.12, clip: 'Idle', t: 0.4 + i * 0.3 });
  camera.position.set(0.3, 2.0, 6.4); camera.lookAt(0, 3.4, -12);
  await st.draw(3);
  return post(cv, { bloom: 0.55, thr: 0.6, vignette: 0.65, cy: 0.5 }).toDataURL('image/jpeg', 0.84);
}


/** Phông sảnh: quảng trường lát đá đêm hội — đài phun Suối Đèn (đèn lồng khổng lồ lơ lửng) ở xa giữa, hai tháp canh, hàng cột đèn hai bên
 *  lối đi, dây đèn lồng giăng ngang phía trên, đèn trời bay, trăng góc phải, sương thấp. Chỗ giữa-dưới để trống cho tướng 3D đứng. */
async function lobby() {
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(SS); renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = num('exp', 1.05);
  setOutlineResolution(W * SS, H * SS);
  const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x1a1838, num('fn', 16), num('ff', 70));
  // trời: đêm xanh thẫm, chân trời tím ấm (hắt ánh đèn hội), sao
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(120, 48, 24), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec3 vP; float h1(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
      void main(){ vec3 d = normalize(vP); float h = d.y;
        vec3 c = mix(vec3(0.42, 0.20, 0.30), vec3(0.13, 0.10, 0.30), smoothstep(-0.02, 0.18, h)); c = mix(c, vec3(0.025, 0.035, 0.10), smoothstep(0.18, 0.75, h));
        c += vec3(1.0, 0.55, 0.28) * exp(-pow((h + 0.01) * 9.0, 2.0)) * 0.45;
        vec3 g = floor(d * 380.0); float st = step(0.9965, h1(g)) * smoothstep(0.12, 0.4, h); c += vec3(0.9, 0.92, 1.0) * st * (0.4 + 0.6 * h1(g + 7.0));
        gl_FragColor = vec4(c, 1.0); }` })));
  // trăng góc phải trên
  { const mx = num('mx', 9), my = num('my', 17), mz = -60;
    const glowS = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xffe2b8, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.5, fog: false }));
    glowS.scale.set(26, 26, 1); glowS.position.set(mx, my, mz - 1); scene.add(glowS);
    const disc = new THREE.Mesh(new THREE.CircleGeometry(3.6, 64), new THREE.ShaderMaterial({ fog: false, transparent: true, depthWrite: false,
      vertexShader: 'varying vec2 vP; void main(){ vP = position.xy / 3.6; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: `varying vec2 vP; float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
        void main(){ float r = length(vP); float m = n(vP * 3.0 + 2.0) * 0.55 + n(vP * 7.0) * 0.3 + n(vP * 15.0) * 0.15;
          vec3 c = mix(vec3(1.0, 0.94, 0.80), vec3(0.80, 0.70, 0.60), smoothstep(0.45, 0.8, m)) * (1.0 - 0.3 * r * r);
          gl_FragColor = vec4(c, 1.0 - smoothstep(0.97, 1.0, r)); }` }));
    disc.position.set(mx, my, mz); scene.add(disc); }
  // ánh sáng: trăng lạnh + bầu trời, đèn hội ấm
  scene.add(new THREE.HemisphereLight(0x8a96ff, 0x2a1a30, 0.55));
  const moonL = new THREE.DirectionalLight(0xb8c4ff, 1.1); moonL.position.set(8, 14, -10); scene.add(moonL);
  const front = new THREE.DirectionalLight(0xffd0a0, 0.55); front.position.set(-4, 6, 12); scene.add(front);
  // nền lát đá
  const ft = flagstoneSurface().clone(); ft.needsUpdate = true; ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(18, 18); ft.anisotropy = 8;
  const groundM = new THREE.MeshStandardMaterial({ map: ft, color: 0x8a8090, roughness: 0.42, metalness: 0.08 });
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), groundM); gnd.rotation.x = -Math.PI / 2; scene.add(gnd);
  // đài phun Suối Đèn ở xa giữa (lối vào quay về phía máy ảnh)
  const S = num('fs', 0.0125);
  const fountain = createFountain(0, 1); fountain.object.scale.setScalar(S); fountain.object.position.set(num('fx', 0), 0, num('fz', -17)); scene.add(fountain.object);
  // quầng sáng / cột sáng cộng màu của đài phun vốn tính cho góc nhìn từ trên cao trong trận: nhìn ngang thì loá trắng cả ảnh → dịu bớt
  const dim = num('fd', 0.3);
  // (kích thước điểm sáng PointsMaterial tính theo đơn vị thế giới, không ăn theo scale của nhóm → phải nhân tay)
  const tame = (root, k) => root.traverse((o) => { const m = o.material; if (!m) return;
    if (o.isPoints) m.size *= S; if (o.isSprite) m.color.multiplyScalar(k); else if (m.blending === THREE.AdditiveBlending && m.color) m.color.multiplyScalar(k); });
  tame(fountain.object, dim);
  // hai tháp canh hai bên xa
  const towers = [];
  for (const sx of [-1, 1]) { const t = createTower(0); t.object.scale.setScalar(S * num('ts', 0.8)); t.object.position.set(sx * num('tx', 15), 0, num('tz', -22)); t.object.rotation.y = sx * 0.5; scene.add(t.object); towers.push(t);
    tame(t.object, 0.5); }
  // cột đèn hai bên lối đi
  const postM = new THREE.MeshStandardMaterial({ color: 0x2a2030, roughness: 0.6, metalness: 0.3 }), gold = new THREE.MeshStandardMaterial({ color: 0xd8a84a, roughness: 0.3, metalness: 0.9 });
  const paper = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff7040).multiplyScalar(1.25) }), halo = new THREE.SpriteMaterial({ map: glowTexture(), color: 0xff9a40, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85 });
  for (const sx of [-1, 1]) for (const [k, z] of [[0, -1.5], [1, -6], [2, -10.5]]) {
    const x = sx * (num('px', 4.2) + k * 0.6), g = new THREE.Group(); g.position.set(x, 0, z);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 2.6, 8), postM); post.position.y = 1.3; g.add(post);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.06, 0.06), postM); arm.position.set(-sx * 0.3, 2.55, 0); g.add(arm);
    const lan = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 0.42, 10), paper); lan.position.set(-sx * 0.58, 2.2, 0); g.add(lan);
    for (const dy of [0.23, -0.23]) { const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.05, 10), gold); cap.position.set(-sx * 0.58, 2.2 + dy, 0); g.add(cap); }
    const s = new THREE.Sprite(halo); s.scale.setScalar(1.8); s.position.set(-sx * 0.58, 2.2, 0); g.add(s);
    const pl = new THREE.PointLight(0xffa050, 5, 7, 1.6); pl.position.set(-sx * 0.58, 2.1, 0.2); g.add(pl);
    scene.add(g);
  }
  // dây đèn lồng giăng ngang (đường võng), đèn đỏ / cam xen kẽ
  const small = new THREE.CylinderGeometry(0.13, 0.11, 0.26, 10), redM = new THREE.MeshBasicMaterial({ color: 0xff5a3a }), orM = new THREE.MeshBasicMaterial({ color: 0xffa54a });
  const ropeM = new THREE.LineBasicMaterial({ color: 0x1a1018 });
  for (const [z, y0, sag, x0, x1, n] of [[-3, 5.6, 1.1, -9, 9, 13], [-8, 6.4, 1.3, -12, 12, 15], [-13, 7.4, 1.4, -15, 15, 17]]) {
    const pts = []; for (let i = 0; i <= 40; i++) { const t = i / 40, x = x0 + (x1 - x0) * t; pts.push(new THREE.Vector3(x, y0 - sag * 4 * t * (1 - t), z)); }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), ropeM));
    for (let i = 1; i < n; i++) { const t = i / n, x = x0 + (x1 - x0) * t, y = y0 - sag * 4 * t * (1 - t) - 0.22;
      const m = new THREE.Mesh(small, i % 2 ? redM : orM); m.position.set(x, y, z); scene.add(m);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: i % 2 ? 0xff5030 : 0xffa040, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.75 }));
      s.scale.setScalar(1.1); s.position.set(x, y, z); scene.add(s); }
  }
  // đèn trời bay xa + bụi sáng
  const lan = lanterns(60); lan.group.scale.setScalar(2.2); lan.group.position.set(0, 1, -14); scene.add(lan.group);
  const sp = sparkles(260); sp.mat.uniforms.uH.value = H * SS; scene.add(sp.object);
  // sương thấp
  const mist = new THREE.SpriteMaterial({ map: glowTexture(), color: 0x8a7cff, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.1 });
  for (let i = 0; i < 30; i++) { const s = new THREE.Sprite(mist); const a = i * 2.4; s.position.set(Math.sin(a) * 12, 0.3, -4 - (i * 7 % 18)); s.scale.set(8, 1.6, 1); scene.add(s); }
  const camera = new THREE.PerspectiveCamera(num('fov', 36), W / H, 0.1, 400);
  camera.position.set(0, num('cy', 1.3), num('cz', 8.5)); camera.lookAt(0, num('ly', 1.75), -10);
  // vũng sáng ấm giữa sân, chỗ bệ tướng (ảnh nền khớp với bệ 3D vẽ đè lên)
  const pool = new THREE.PointLight(0xffb070, num('pool', 9), 9, 1.4); pool.position.set(0, 1.8, 1.5); scene.add(pool);
  for (let i = 0, t = 0; i < 60; i++) { t += 0.05; fountain.update(0.05); for (const tw of towers) tw.update(0.05, 1, false); lan.update(t, 0.05); sp.mat.uniforms.uT.value = t; }
  renderer.render(scene, camera); await wait(80); renderer.render(scene, camera);
  return post(cv, { bloom: num('bl', 0.6), thr: num('thr', 0.55), vignette: num('vg', 0.55), cy: 0.5 }).toDataURL('image/jpeg', 0.86);
}

const run = { card, face, splash, keyart, room, lobby }[mode];
run().then((d) => { window.out = d; }).catch((e) => { window.err = String(e && e.stack || e); });
</script>
