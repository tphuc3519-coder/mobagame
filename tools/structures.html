<!doctype html><meta charset="utf-8"><title>Structures</title>
<style>html,body{margin:0;background:#2a3a2c}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../lib/three/build/three.module.js", "three/addons/": "../lib/three/examples/jsm/" } }</script>
<script type="module">
// Xem trụ / tế đàn / suối (src/render/structures.js) từ góc nhìn trong trận và góc nghiêng gần. ?team=0|1
import * as THREE from 'three';
import { createTower, createCore, createFountain } from '../src/render/structures.js';
const team = +(new URLSearchParams(location.search).get('team') || 0);
const W = 1500, H = 560, r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.9; document.body.append(r.domElement);
r.setScissorTest(true);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x2a3a2c);
sc.add(new THREE.HemisphereLight(0xd8e6ff, 0x5a4a38, 0.7)); const k = new THREE.DirectionalLight(0xffe6c4, 1.75); k.position.set(600, 1200, 800); sc.add(k);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 3000), new THREE.MeshLambertMaterial({ color: 0x6a7a52 })); ground.rotation.x = -Math.PI / 2; sc.add(ground);
const tw = createTower(team), co = createCore(team), fo = createFountain(team);
tw.object.position.x = -900; co.object.position.x = 400; fo.object.position.x = 1700; sc.add(tw.object, co.object, fo.object);
for (const p of [tw, co]) p.update(0.016, 1, false);
const views = [[0, 0.5, [-900, 260, 0], 1300, 0.42], [0.5, 0.5, [400, 300, 0], 2600, 0.42]];
const close = new URLSearchParams(location.search).has('close'); // ?close=1: cận trụ (góc trận + ngang) và tế đàn
const V = close ? [[0, 0.25, [-900, 450, 0], 1300, 0.95], [0.25, 0.25, [-900, 560, 0], 900, 0.2], [0.5, 0.5, [400, 380, 0], 2300, 0.95]] : [[0, 0.33, [-900, 330, 0], 1500, 0.35], [0.33, 0.67, [400, 380, 0], 3000, 0.62]];
for (const [x0, w, tgt, d, pitch] of V) {
  const cam = new THREE.PerspectiveCamera(40, (W * w) / H, 10, 20000); cam.position.set(tgt[0] + d * 0.35, tgt[1] + d * Math.sin(pitch), tgt[2] + d * Math.cos(pitch)); cam.lookAt(...tgt);
  r.setViewport(W * x0, 0, W * w, H); r.setScissor(W * x0, 0, W * w, H); r.render(sc, cam);
}
void views; window.__ready = true;
</script>
