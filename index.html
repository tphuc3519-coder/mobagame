<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D MOBA Champion Showcase (Liên Quân / Arena of Valor)</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Three.js, OrbitControls, and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- MOBA HUD & Showcase UI -->
  <div id="ui-overlay">
    <!-- Top Header / Hero Banner -->
    <div class="hero-header">
      <div class="hero-badge">ĐẤU SĨ / PALADIN</div>
      <h1 class="hero-name" id="hero-display-name">ARTHUR - HOÀNG KIM CHIẾN THẦN</h1>
      <div class="hero-sub">Mô hình 3D Nhân vật Chi tiết (Xoay 360°, Xem Nhiều Góc & Chụp Ảnh)</div>
    </div>

    <!-- Mode Selector & Controls Info -->
    <div class="top-controls">
      <button id="btn-switch-hero" class="ui-btn gold-btn">🔄 Đổi Tướng (Arthur / Cyber Bot)</button>
      <button id="btn-take-photo" class="ui-btn photo-btn">📸 Chụp Ảnh Tướng (Download PNG)</button>
    </div>

    <!-- Camera Angle Preset Bar -->
    <div class="cam-bar">
      <span class="cam-label">📐 GÓC NHÌN:</span>
      <button id="cam-front" class="cam-btn active">Chính Diện</button>
      <button id="cam-back" class="cam-btn">Sau Lưng</button>
      <button id="cam-closeup" class="cam-btn">Cận Cảnh (Face)</button>
      <button id="cam-top" class="cam-btn">Góc Trên Cao</button>
      <button id="cam-side" class="cam-btn">Góc Nghiêng 45°</button>
    </div>

    <!-- Instructions Overlay -->
    <div class="instructions-panel">
      <div class="inst-item">🎮 <strong>Di chuyển:</strong> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> hoặc Cần gạt ảo 360°</div>
      <div class="inst-item">🔄 <strong>Xoay Camera 360°:</strong> Nhấp giữ chuột trái & kéo xung quanh</div>
      <div class="inst-item">🔍 <strong>Zoom:</strong> Cuộn chuột (Scroll Wheel)</div>
    </div>

    <!-- Virtual Joystick for Touch / Mouse Drag -->
    <div id="joystick-container">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
      <div class="joystick-label">CẦN GẠT 360°</div>
    </div>

    <!-- Ability Buttons (Bottom Right MOBA Style) -->
    <div class="moba-skill-bar">
      <div class="skill-icon" id="skill-q">
        <span class="key">Q</span>
        <span class="label">Đánh</span>
      </div>
      <div class="skill-icon" id="skill-w">
        <span class="key">W</span>
        <span class="label">Chạy</span>
      </div>
      <div class="skill-icon ult" id="skill-r">
        <span class="key">R</span>
        <span class="label">Tuyệt Kỹ</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
