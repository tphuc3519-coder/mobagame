<title>Phòng Trưng Bày Tướng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Bố cục: sân khấu 3D bên trái, danh sách tướng và clip bên phải; xếp dọc trên điện thoại. */
  :root {
    --ink: #f3e9d6;        /* giấy dó */
    --dim: #a89f93;
    --night: #0f1224;      /* trời đêm hội */
    --panel: #171b33;
    --line: #2a3050;
    --lantern: #ffb84d;    /* ánh đèn lồng */
    --rim: #8fd3ff;
    --font-body: "Be Vietnam Pro", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--night); color: var(--ink); }
  body { margin: 0; font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  .app { max-width: 1240px; margin: 0 auto; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: relative; height: clamp(380px, 68vh, 760px); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: radial-gradient(120% 90% at 50% 15%, #262a52 0%, var(--night) 70%); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .badge { position: absolute; left: 14px; top: 12px; pointer-events: none; }
  .badge b { display: block; font-size: 22px; font-weight: 800; text-shadow: 0 1px 6px #000a; }
  .badge span { font-size: 12px; color: var(--dim); }
  .stats { position: absolute; left: 14px; bottom: 12px; right: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 11.5px var(--font-data); color: var(--dim); pointer-events: none; }
  .stats i { font-style: normal; color: var(--ink); }
  .hint { position: absolute; right: 14px; top: 14px; font-size: 11.5px; color: var(--dim); pointer-events: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); background: #0f1224aa; }
  #loading[hidden] { display: none; }
  section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .side { display: flex; flex-direction: column; gap: 18px; }
  .heroes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; text-align: left; }
  button:hover { border-color: var(--rim); }
  button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--lantern); background: #2a2440; }
  .hero-btn { display: flex; flex-direction: column; gap: 0; }
  .hero-btn b { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
  .hero-btn b::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--rim)); box-shadow: 0 0 8px var(--dot, var(--rim)); flex: none; }
  .hero-btn small { color: var(--dim); font-size: 11.5px; }
  .clips { display: flex; flex-wrap: wrap; gap: 6px; }
  .clips button { padding: 5px 10px; font: 500 12px var(--font-data); text-align: center; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .note { margin: 0; color: var(--dim); font-size: 12px; }
</style>

<div class="app">
  <header>
    <h1>Phòng Trưng Bày Tướng</h1>
    <p>30 tướng Lantern Arena, model sinh bằng code. Kéo để xoay, cuộn hoặc chụm để phóng to.</p>
  </header>
  <div class="grid">
    <div class="stage" id="stage">
      <div class="badge"><b id="hname">Lanternward</b><span id="hrole"></span></div>
      <div class="hint">Kéo để xoay 360°</div>
      <div class="stats" id="stats"></div>
      <div id="loading">Đang nạp model…</div>
    </div>
    <div class="side">
      <section>
        <h2>Tướng</h2>
        <div class="heroes" id="heroes"></div>
      </section>
      <section>
        <h2>Animation</h2>
        <div class="clips" id="clips"></div>
      </section>
      <section>
        <h2>Hiển thị</h2>
        <div class="toggles">
          <button id="tSpin" aria-pressed="true">Tự xoay</button>
          <button id="tWire" aria-pressed="false">Lưới</button>
          <button id="tFace" aria-pressed="false">Cận mặt</button>
          <button id="tGame" aria-pressed="false">Camera trận</button>
        </div>
        <p class="note">Camera trận cho thấy tướng cao bao nhiêu trên màn hình khi chơi thật (nghiêng 55°).</p>
      </section>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { prepareUnitMaterials, setOutlineResolution } from './src/render/materials.js';

const HEROES = [
  ['thach_quy', 'Mossback', 'Đỡ đòn · Trợ thủ', '#7fd1a8'], ['trau_dong', 'Trâu Đồng', 'Đỡ đòn · Đấu sĩ', '#d9a441'],
  ['co_thu', 'Cổ Thụ', 'Đỡ đòn · Trợ thủ', '#8fdc70'], ['hoa_ren', 'Emberforge', 'Đấu sĩ', '#ff7a1a'],
  ['kiem_may', 'Kiếm Mây', 'Đấu sĩ · Sát thủ', '#9fd0ff'], ['soi_nui', 'Sói Núi', 'Đấu sĩ', '#ffcc33'],
  ['bong_tre', 'Bamboo Shade', 'Sát thủ', '#6fbf73'], ['doi_dem', 'Dơi Đêm', 'Sát thủ · Pháp sư', '#9a6bff'],
  ['nguyet_ha', 'Moonstream', 'Pháp sư', '#8fd3ff'], ['sam_trong', 'Sấm Trống', 'Pháp sư', '#5fd0ff'],
  ['hoa_doc', 'Hoa Độc', 'Pháp sư · Trợ thủ', '#6bd36b'], ['canh_dieu', 'Kitewing', 'Xạ thủ', '#a8e6ff'],
  ['phao_hoa', 'Pháo Hoa', 'Xạ thủ', '#f6e05e'], ['trang_no', 'Trạng Nỏ', 'Xạ thủ', '#7fe0d0'],
  ['long_dang', 'Lanternward', 'Trợ thủ', '#ffc15e'], ['moc_cam', 'Mộc Cầm', 'Trợ thủ · Pháp sư', '#7ad3c6'],
  ['hanh_hoa', 'Hạnh Hoa', 'Trợ thủ · Đấu sĩ', '#f2c14e'],
  ['tieu_anh', 'Tiểu Ảnh', 'Xạ thủ', '#ff8a7a'],
  ['ba_nam', 'Bà Năm Chảo', 'Đấu sĩ', '#ff7a8a'],
  ['cau_may', 'Cầu Mây', 'Xạ thủ', '#6fd6a0'],
  ['bong_den', 'Bóng Đèn', 'Pháp sư', '#b08aff'],
  ['thay_do', 'Thầy Đồ', 'Đấu sĩ · Pháp sư', '#c9a24a'],
  ['kep_cheo', 'Kép Chèo', 'Đấu sĩ', '#f0c040'],
  ['meo_than_tai', 'Mèo Thần Tài', 'Đỡ đòn · Trợ thủ', '#f0c040'],
  ['phu_dong', 'Phù Đổng', 'Đỡ đòn · Đấu sĩ', '#ff7a3a'],
  ['thu_linh', 'Thư Linh', 'Pháp sư', '#7ad0ff'],
  ['kiem_thuy', 'Kiếm Thuỷ', 'Đấu sĩ · Sát thủ', '#6ad4ff'],
  ['luong_cuc', 'Lưỡng Cực', 'Pháp sư', '#8a7aff'],
  ['nhan_su', 'Nhãn Sư', 'Xạ thủ · Sát thủ', '#5affd0'],
  ['trang_nhi', 'Trạng Nhí', 'Xạ thủ · Trợ thủ', '#7ad8ff'],
];
const CLIPS = ['Idle', 'Run', 'Attack1', 'Attack2', 'Cast1', 'Cast2', 'Ult', 'Death', 'Recall', 'Victory', 'Showcase'];
const LOOPS = new Set(['Idle', 'Run', 'Recall', 'Showcase']);
const $ = (s) => document.querySelector(s);

const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
controls.minDistance = 1.5; controls.maxDistance = 30; controls.maxPolarAngle = Math.PI * 0.52;

scene.add(new THREE.HemisphereLight(0xe4ecff, 0x6a5a48, 0.85));
const key = new THREE.DirectionalLight(0xfff0dc, 1.9); key.position.set(2.5, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fd3ff, 2.2); rim.position.set(-3, 2.5, -3); scene.add(rim);
{
  const pm = new THREE.PMREMGenerator(renderer), s = new THREE.Scene();
  s.background = new THREE.Color(0x1a2238);
  s.add(new THREE.Mesh(new THREE.SphereGeometry(5, 16, 12), new THREE.MeshBasicMaterial({ color: 0xc4c8d8, side: THREE.BackSide })));
  const l = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffd9a0 })); l.position.set(3, 3, 3); s.add(l);
  scene.environment = pm.fromScene(s, 0.04).texture;
}
const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.4, 0.06, 48), new THREE.MeshStandardMaterial({ color: 0x2a3050, roughness: 0.6, metalness: 0.3 }));
disc.position.y = -0.03; scene.add(disc);
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.018, 8, 64), new THREE.MeshBasicMaterial({ color: 0xffb84d }));
ring.rotation.x = Math.PI / 2; scene.add(ring);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  setOutlineResolution(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
new ResizeObserver(resize).observe(stage); resize();

const loader = new GLTFLoader();
const cache = new Map();
let cur = null, mixer = null, actions = {}, active = null, H = 1.8, wire = false, id = null;

function fit(mode = 'front') {
  const d = H * 2.15 * Math.max(1, 0.9 / camera.aspect);
  controls.minPolarAngle = 0;
  if (mode === 'game') {
    const a = 55 * Math.PI / 180, dist = 23;
    controls.target.set(0, 0.6, 0); camera.position.set(0, 0.6 + Math.sin(a) * dist, Math.cos(a) * dist);
  } else if (mode === 'face') {
    controls.target.set(0, H * 0.87, 0); camera.position.set(0, H * 0.9, H * 0.62);
  } else {
    controls.target.set(0, H * 0.5, 0); camera.position.set(d * 0.35, H * 0.62, d * 0.94);
  }
  controls.update();
}

function play(name) {
  const a = actions[name]; if (!a) return;
  if (active && active !== a) active.fadeOut(0.15);
  a.reset().fadeIn(0.15).play();
  a.setLoop(LOOPS.has(name) ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  a.clampWhenFinished = true;
  active = a; active._name = name;
  document.querySelectorAll('#clips button').forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === name)));
}

// Nạp .glb; nếu máy chủ không phục vụ .glb (như trang xem trước đã đăng) thì dùng bản base64 .glb.json.
async function loadGlb(hid) {
  const url = `./assets/heroes/${hid}/${hid}.glb`;
  try { return await loader.loadAsync(url); } catch (_) { /* thử bản json */ }
  const j = await (await fetch(url + '.json')).json();
  const bin = atob(j.b64), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return loader.parseAsync(buf.buffer, './');
}

async function show(hid) {
  const h = HEROES.find((x) => x[0] === hid); if (!h) return;
  id = hid;
  $('#hname').textContent = h[1]; $('#hrole').textContent = h[2];
  document.documentElement.style.setProperty('--rim', h[3]);
  rim.color.set(h[3]);
  document.querySelectorAll('.hero-btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === hid)));
  $('#loading').hidden = false;
  try {
    let g = cache.get(hid);
    if (!g) { g = await loadGlb(hid); g.mats = prepareUnitMaterials(g.scene, h[3]); cache.set(hid, g); }
    g.mats.uniforms.rim.value.set(h[3]);
    if (id !== hid) return;
    if (cur) scene.remove(cur);
    cur = g.scene; scene.add(cur);
    cur.traverse((o) => { if (o.isMesh) { o.frustumCulled = false; [].concat(o.material).forEach((m) => (m.wireframe = wire)); } });
    const box = new THREE.Box3().setFromObject(cur);
    H = Math.max(1.6, box.max.y);
    let tris = 0, bones = 0;
    cur.traverse((o) => { if (o.isBone) bones++; if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    $('#stats').innerHTML = `<span>cao <i>${box.max.y.toFixed(2)} m</i></span><span>tam giác <i>${Math.round(tris).toLocaleString('vi-VN')}</i></span><span>xương <i>${bones}</i></span><span>clip <i>${g.animations.length}</i></span>`;
    mixer = new THREE.AnimationMixer(cur);
    mixer.addEventListener('finished', (e) => { const n = e.action._name; if (n && n !== 'Death') setTimeout(() => active === e.action && play('Idle'), 350); });
    actions = {}; for (const c of g.animations) actions[c.name] = mixer.clipAction(c);
    play('Idle');
    fit(modes.face ? 'face' : modes.game ? 'game' : 'front');
  } catch (e) {
    $('#stats').textContent = 'Không nạp được model: ' + e.message;
  }
  $('#loading').hidden = true;
}

// giao diện
const modes = { face: false, game: false };
$('#heroes').innerHTML = HEROES.map(([i, n, r, c]) => `<button class="hero-btn" data-id="${i}" style="--dot:${c}" aria-pressed="false"><b>${n}</b><small>${r}</small></button>`).join('');
$('#clips').innerHTML = CLIPS.map((c) => `<button aria-pressed="false">${c}</button>`).join('');
$('#heroes').onclick = (e) => { const b = e.target.closest('.hero-btn'); if (b) { show(b.dataset.id); try { history.replaceState(null, '', '#' + b.dataset.id); } catch (_) {} } };
$('#clips').onclick = (e) => { const b = e.target.closest('button'); if (b) play(b.textContent); };
const setMode = (m) => { modes.face = m === 'face' ? !modes.face : false; modes.game = m === 'game' ? !modes.game : false;
  $('#tFace').setAttribute('aria-pressed', String(modes.face)); $('#tGame').setAttribute('aria-pressed', String(modes.game));
  fit(modes.face ? 'face' : modes.game ? 'game' : 'front'); };
$('#tFace').onclick = () => setMode('face'); $('#tGame').onclick = () => setMode('game');
$('#tSpin').onclick = (e) => { controls.autoRotate = !controls.autoRotate; e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate)); };
$('#tWire').onclick = (e) => { wire = !wire; e.currentTarget.setAttribute('aria-pressed', String(wire)); cur?.traverse((o) => o.isMesh && [].concat(o.material).forEach((m) => (m.wireframe = wire))); };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { mixer?.update(clock.getDelta()); controls.update(); renderer.render(scene, camera); });

const start = (location.hash || '').slice(1);
show(HEROES.some((h) => h[0] === start) ? start : 'long_dang');
</script>
