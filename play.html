
<title>Lantern Arena</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1224; color: #f3e9d6; font: 14px system-ui, sans-serif; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #fs { position: fixed; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); z-index: 5; background: #171b33cc; color: inherit; border: 1px solid #2a3050; border-radius: 6px; padding: 6px 10px; font: inherit; }
  #skills { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); width: 330px; height: 250px; z-index: 4; }
  .sb { position: absolute; border-radius: 50%; border: 2px solid #f3e9d6aa; background: #171b33d9; color: #f3e9d6; font: 700 13px system-ui, sans-serif; overflow: hidden; touch-action: none; display: grid; place-items: center; padding: 0; }
  .sb.down { transform: scale(0.94); border-color: #ffb84d; }
  .atk { right: 0; bottom: 0; width: 96px; height: 96px; background: #4a2226d9; font-size: 16px; }
  .sk { width: 66px; height: 66px; }
  .sk[data-k="s1"] { right: 112px; bottom: 6px; } .sk[data-k="s2"] { right: 96px; bottom: 82px; } .sk[data-k="s3"] { right: 20px; bottom: 112px; width: 72px; height: 72px; }
  .cd { position: absolute; left: 0; right: 0; bottom: 0; background: #0009; pointer-events: none; }
  .cdt { position: absolute; font-size: 18px; pointer-events: none; }
  .nm { position: relative; z-index: 1; } .cooling .nm { opacity: 0; }
  .sk.nomana { border-color: #4a9cff; color: #7ab4ff; } .sk.locked { opacity: 0.45; }
  .lvl { position: absolute; top: -2px; right: -2px; width: 26px; height: 26px; border-radius: 50%; background: #ffb84d; color: #1a1200; font-style: normal; display: none; place-items: center; font-size: 18px; z-index: 3; }
  .pips { position: absolute; bottom: 3px; font-size: 7px; letter-spacing: 1px; color: #ffb84d; text-decoration: none; }
  .cancel { position: absolute; right: 60px; top: -60px; background: #ff5a4acc; color: #fff; padding: 6px 14px; border-radius: 6px; font: 700 13px system-ui, sans-serif; }

  #extras { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); width: 330px; height: 250px; z-index: 4; pointer-events: none; }
  .sb.mini { width: 46px; height: 46px; pointer-events: auto; border-width: 2px; background: #171b33e6; }
  .sb.mini .ico { position: absolute; inset: 0; } .sb.mini .cd { z-index: 2; } .sb.mini .cdt { z-index: 3; text-shadow: 0 0 4px #000; }
  .spell { right: 190px; bottom: 8px; } .recall { right: 190px; bottom: 62px; } .itemAct { right: 248px; bottom: 34px; }
  .recall small { position: absolute; bottom: 1px; z-index: 3; font-size: 9px; text-shadow: 0 0 3px #000; } .recall.on { border-color: #8fe8ff; }
  .recall .prog { position: absolute; left: 0; right: 0; bottom: 0; background: #8fe8ff66; z-index: 2; pointer-events: none; }
  .sb[hidden] { display: none; }
  .spell.locked { opacity: 0.35; }
  .ic { display: block; width: 100%; height: 100%; box-sizing: border-box; border: 2px solid #6d7388; border-radius: 9px; position: relative; overflow: hidden; }
  .ic { filter: hue-rotate(var(--h, 0deg)); }
  .ic.round { border-radius: 50%; border-color: #f3e9d6aa; } .ic.empty { background: #0004; }
  .ic svg { position: absolute; inset: 19%; width: 62%; height: 62%; filter: drop-shadow(0 1px 1px #0008); }
  .ic .sub { position: absolute; left: 2px; top: 2px; width: 34%; height: 34%; inset: auto; }
  .coin { width: 16px; height: 16px; vertical-align: -3px; }
  #shopRoot { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #shopRoot > * { pointer-events: auto; }
  .goldPill { position: absolute; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 6px; background: #171b33e6; border: 1px solid #f2c25a88; border-radius: 18px; padding: 5px 12px 5px 8px; font: 700 15px ui-monospace, monospace; color: #ffe08a; cursor: pointer; }
  .goldPill small { font: 600 10px system-ui, sans-serif; color: #f3e9d6aa; }
  .qb { position: absolute; left: max(10px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 42px); display: flex; gap: 6px; }
  .q { position: relative; width: 52px; height: 52px; padding: 0; background: none; border: 0; }
  .q .ic { border-radius: 10px; } .q:not(.ready) .ic { filter: hue-rotate(var(--h, 0deg)) grayscale(0.7) brightness(0.7); } .q.ready .ic { border-color: #7ee8a0; box-shadow: 0 0 10px #7ee8a0aa; }
  .q .pr, .cell .pr { position: absolute; right: 2px; bottom: 1px; font: 800 11px ui-monospace, monospace; color: #ffe08a; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .q small { position: absolute; left: 0; top: 54px; width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font: 600 10px system-ui, sans-serif; color: #f3e9d6cc; text-shadow: 0 0 3px #000; }
  .bar { position: absolute; right: calc(max(12px, env(safe-area-inset-right)) + 344px); bottom: max(12px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, 40px); grid-auto-rows: 40px; gap: 4px; }
  .slot { padding: 0; border: 0; background: none; border-radius: 9px; } .slot.blank { border: 2px dashed #f3e9d633; background: #0a0d1c88; }
  .shop { position: absolute; left: 0; top: 0; bottom: 0; width: min(700px, 88vw); transform: translateX(-104%); transition: transform 0.22s ease-out; background: #10142af2; border-right: 2px solid #f2c25a55; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left); box-shadow: 8px 0 24px #0008; }
  .shop.on { transform: none; }
  .shop header { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-bottom: 1px solid #2a3050; font-size: 15px; }
  .shop header .sg { margin-left: auto; color: #ffe08a; font: 700 15px ui-monospace, monospace; } .shop .x { background: none; border: 0; color: #f3e9d6; font-size: 26px; line-height: 1; padding: 0 6px; }
  .sbody { flex: 1; display: flex; min-height: 0; }
  .shop nav { width: 92px; display: flex; flex-direction: column; gap: 3px; padding: 6px; border-right: 1px solid #2a3050; overflow-y: auto; }
  .shop nav button { background: #171b33; color: #f3e9d6aa; border: 1px solid #2a3050; border-radius: 6px; padding: 8px 4px; font: 600 12px system-ui, sans-serif; }
  .shop nav button.on { background: #2a2f57; color: #ffe08a; border-color: #f2c25a; }
  .grid { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, 60px); grid-auto-rows: 60px; gap: 8px; align-content: start; }
  .cell { position: relative; width: 60px; height: 60px; padding: 0; background: none; border: 0; } .cell.dim .ic { filter: hue-rotate(var(--h, 0deg)) grayscale(0.6) brightness(0.75); } .cell.sel .ic { border-color: #7ee8ff; box-shadow: 0 0 10px #7ee8ffaa; }
  .cell.own::after { content: '✓'; position: absolute; left: 3px; top: 1px; color: #7ee8a0; font: 800 13px system-ui; text-shadow: 0 0 3px #000; }
  .cell.mini { width: 44px; height: 44px; } .cell.mini.got .ic { border-color: #7ee8a0; }
  .shop aside { width: 210px; padding: 8px 10px; border-left: 1px solid #2a3050; overflow-y: auto; font-size: 12px; }
  .shop aside .dh { display: flex; gap: 10px; align-items: center; } .shop aside .dh .ic { width: 48px; height: 48px; flex: none; } .shop aside .dh b { display: block; font-size: 14px; } .shop aside small { color: #f3e9d6aa; }
  .shop aside ul { margin: 8px 0; padding-left: 16px; color: #b8f0c8; } .shop aside .note { color: #f3e9d6cc; line-height: 1.35; margin: 6px 0; } .shop aside .act { color: #ffb84d; }
  .recipe { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 8px 0; } .recipe b { color: #f3e9d688; }
  .buyrow { display: flex; gap: 6px; margin-top: 8px; } .buy, .sell { flex: 1; padding: 9px 4px; border-radius: 8px; border: 1px solid #f2c25a; background: #3a3216; color: #ffe08a; font: 700 13px system-ui, sans-serif; }
  .buy.off { opacity: 0.45; border-color: #555; } .sell { border-color: #ff7a6a; color: #ff9a8a; background: #3a1a1a; flex: 0.8; }
  .why { color: #ff9a8a; margin: 6px 0 0; } .hint { color: #f3e9d688; padding: 6px; line-height: 1.4; }
  #lab { position: fixed; left: 50%; transform: translateX(-50%); top: max(8px, env(safe-area-inset-top)); z-index: 5; display: flex; gap: 6px; }
  #lab select, #lab button { background: #171b33cc; color: #f3e9d6; border: 1px solid #2a3050; border-radius: 6px; padding: 5px 9px; font: 12px system-ui, sans-serif; }
  #result { position: fixed; inset: 0; z-index: 9; display: none; place-items: center; text-align: center; background: #0f1224cc; }
  #result.on { display: grid; } #result h2 { font-size: 56px; margin: 0; letter-spacing: 0.1em; color: #ffb84d; }
  #result button { margin-top: 16px; font: 700 15px system-ui, sans-serif; padding: 10px 22px; border-radius: 8px; border: 1px solid #ffb84d; background: #171b33; color: #f3e9d6; }
  #rotate, #lost { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; text-align: center; background: #0f1224; padding: 24px; }
  #lost.on { display: grid; }
  @media (orientation: portrait) { #rotate { display: grid; } }
</style>
